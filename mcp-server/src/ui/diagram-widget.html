<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArchDraw diagram</title>
  <style>
    :root {
      --paper: #fdfdfc;
      --ink: #1c2230;
      --muted: #6b7280;
      --line: #e3e5ea;
      --chip: #ffffff;
      --chip-hover: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--paper); }
    .stage { position: relative; height: 480px; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
    .stage.panning { cursor: grabbing; }
    body.fullscreen .stage { height: 100vh; }
    #diagram { position: absolute; top: 0; left: 0; max-width: none; pointer-events: none; }
    .title { position: absolute; top: 14px; left: 18px; right: 220px; overflow: hidden; margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); font-size: 13px; text-align: center; }
    .bar { position: absolute; display: flex; gap: 6px; }
    .bar.top { top: 10px; right: 10px; }
    .bar.bottom { right: 10px; bottom: 10px; }
    .group { display: flex; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); box-shadow: 0 1px 2px rgb(16 24 40 / 6%); }
    .group button + button { border-left: 1px solid var(--line); }
    button, a.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 13px; font-weight: 550; text-decoration: none; cursor: pointer; }
    a.chip, button.chip { border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px rgb(16 24 40 / 6%); }
    button:hover, a.chip:hover { background: var(--chip-hover); }
    button:disabled { cursor: wait; opacity: .6; }
    button.icon { justify-content: center; width: 32px; padding: 0; }
    button:focus-visible, a:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    svg.glyph { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="ArchDraw diagram preview">
    <p class="message" id="message">Drawing the diagram…</p>
    <h1 class="title" id="title"></h1>
    <div class="bar top">
      <a class="chip" id="open" hidden target="_blank" rel="noopener noreferrer">
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M12 9.5v4H2.5V4h4"/></svg>Open in ArchDraw
      </a>
      <button type="button" class="chip" id="fullscreen" hidden>
        <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M6 13.5H2.5V10M13.5 2.5 9.5 6.5M2.5 13.5l4-4"/></svg><span id="fullscreen-label">Expand</span>
      </button>
    </div>
    <div class="bar bottom" id="controls" hidden>
      <div class="group">
        <button type="button" class="icon" id="zoom-out" aria-label="Zoom out"><svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
        <button type="button" class="icon" id="zoom-in" aria-label="Zoom in"><svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
        <button type="button" class="icon" id="zoom-fit" aria-label="Fit to view"><svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      </div>
      <button type="button" class="chip" id="download"><svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11"/></svg>PNG</button>
    </div>
  </main>
  <script>
    (() => {
      const META_KEY = 'archdraw/previewSvg';
      const MIN_ZOOM = 0.5; // relative to the fitted view
      const MAX_ZOOM = 6;
      const pending = new Map();
      let requestId = 0;
      const $ = (id) => document.getElementById(id);
      const stage = $('stage');
      // Created here rather than in the markup so there is never an <img> without a source.
      const image = Object.assign(document.createElement('img'), { id: 'diagram', hidden: true, alt: '' });
      stage.prepend(image);

      function request(method, params) {
        const id = ++requestId;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => { pending.delete(id); reject(new Error('The chat did not respond.')); }, 10000);
          pending.set(id, { resolve, reject, timeout });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }

      function notify(method, params) {
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      }

      // ── Viewport: the image is laid out at natural size × scale, so text stays crisp.
      let natural = null; // { width, height } of the SVG
      let fitScale = 1;
      let view = { scale: 1, x: 0, y: 0 };
      let displayMode = 'inline';

      function applyView() {
        if (!natural) return;
        image.style.width = `${natural.width * view.scale}px`;
        image.style.height = `${natural.height * view.scale}px`;
        image.style.transform = `translate(${view.x}px, ${view.y}px)`;
      }

      function fitView() {
        if (!natural) return;
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        const top = 48; // keep the title and top buttons clear
        const pad = 20;
        fitScale = Math.min((width - pad * 2) / natural.width, (height - top - pad - 44) / natural.height);
        view = {
          scale: fitScale,
          x: (width - natural.width * fitScale) / 2,
          y: top + (height - top - 44 - natural.height * fitScale) / 2,
        };
        applyView();
      }

      // Inline, the canvas takes the diagram's shape (within limits) instead of a
      // fixed height, so wide diagrams don't sit in a band of empty paper.
      const CHROME_HEIGHT = 48 + 44 + 20; // title row, controls row, padding
      function fitStageHeight() {
        if (!natural || displayMode === 'fullscreen') return;
        const drawn = (stage.clientWidth - 40) * (natural.height / natural.width);
        stage.style.height = `${Math.round(Math.min(560, Math.max(300, drawn + CHROME_HEIGHT)))}px`;
      }

      function zoomAt(factor, px = stage.clientWidth / 2, py = stage.clientHeight / 2) {
        if (!natural) return;
        const scale = Math.min(fitScale * MAX_ZOOM, Math.max(fitScale * MIN_ZOOM, view.scale * factor));
        const ratio = scale / view.scale;
        view = { scale, x: px - (px - view.x) * ratio, y: py - (py - view.y) * ratio };
        applyView();
      }

      const local = (event) => {
        const rect = stage.getBoundingClientRect();
        return [event.clientX - rect.left, event.clientY - rect.top];
      };

      stage.addEventListener('wheel', (event) => {
        // Inline, a plain scroll keeps scrolling the chat; pinch (ctrl) or ⌘ zooms.
        if (!natural || (displayMode !== 'fullscreen' && !event.ctrlKey && !event.metaKey)) return;
        event.preventDefault();
        if (event.ctrlKey || event.metaKey) zoomAt(Math.exp(-event.deltaY * 0.01), ...local(event));
        else { view = { ...view, x: view.x - event.deltaX, y: view.y - event.deltaY }; applyView(); }
      }, { passive: false });

      const pointers = new Map();
      let pinchDistance = 0;
      stage.addEventListener('pointerdown', (event) => {
        if (!natural || event.target.closest('button, a')) return;
        stage.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        stage.classList.add('panning');
      });
      stage.addEventListener('pointermove', (event) => {
        const previous = pointers.get(event.pointerId);
        if (!previous) return;
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          const distance = Math.hypot(a.x - b.x, a.y - b.y);
          const rect = stage.getBoundingClientRect();
          if (pinchDistance) zoomAt(distance / pinchDistance, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);
          pinchDistance = distance;
          return;
        }
        view = { ...view, x: view.x + event.clientX - previous.x, y: view.y + event.clientY - previous.y };
        applyView();
      });
      const release = (event) => {
        pointers.delete(event.pointerId);
        pinchDistance = 0;
        if (!pointers.size) stage.classList.remove('panning');
      };
      stage.addEventListener('pointerup', release);
      stage.addEventListener('pointercancel', release);
      stage.addEventListener('dblclick', (event) => {
        if (!event.target.closest('button, a')) zoomAt(1.6, ...local(event));
      });

      $('zoom-in').addEventListener('click', () => zoomAt(1.4));
      $('zoom-out').addEventListener('click', () => zoomAt(1 / 1.4));
      $('zoom-fit').addEventListener('click', fitView);

      // ── Host sizing: hosts size the inline frame from these reports (as the ext-apps SDK does).
      let reported = { width: 0, height: 0 };
      let sizeQueued = false;
      function reportSize() {
        if (sizeQueued || displayMode === 'fullscreen') return;
        sizeQueued = true;
        requestAnimationFrame(() => {
          sizeQueued = false;
          const root = document.documentElement;
          const previous = root.style.height;
          root.style.height = 'max-content';
          const height = Math.ceil(root.getBoundingClientRect().height);
          root.style.height = previous;
          const width = Math.ceil(window.innerWidth);
          if (width === reported.width && height === reported.height) return;
          reported = { width, height };
          notify('ui/notifications/size-changed', { width, height });
        });
      }

      function setDisplayMode(mode) {
        displayMode = mode === 'fullscreen' ? 'fullscreen' : 'inline';
        document.body.classList.toggle('fullscreen', displayMode === 'fullscreen');
        stage.style.height = '';
        fitStageHeight();
        $('fullscreen-label').textContent = displayMode === 'fullscreen' ? 'Exit' : 'Expand';
        reported = { width: 0, height: 0 };
        reportSize();
        requestAnimationFrame(fitView);
      }

      $('fullscreen').addEventListener('click', async () => {
        try {
          const result = await request('ui/request-display-mode', { mode: displayMode === 'fullscreen' ? 'inline' : 'fullscreen' });
          setDisplayMode(result.mode);
        } catch {
          $('fullscreen').hidden = true;
        }
      });

      // ── Download: the whole diagram (not the current view) as a PNG up to 3×.
      function fileName() {
        const base = String($('title').textContent || 'archdraw-diagram').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        return `${base || 'archdraw-diagram'}.png`;
      }

      async function downloadPng() {
        if (!natural) return;
        const button = $('download');
        button.disabled = true;
        try {
          const scale = Math.min(3, 8000 / Math.max(natural.width, natural.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(natural.width * scale);
          canvas.height = Math.round(natural.height * scale);
          const context = canvas.getContext('2d');
          context.fillStyle = '#fdfdfc';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/png');
          const name = fileName();
          try {
            const result = await request('ui/download-file', {
              contents: [{ type: 'resource', resource: { uri: `file:///${name}`, mimeType: 'image/png', blob: dataUrl.split(',')[1] } }],
            });
            if (result.isError) throw new Error('The chat did not save the file.');
          } catch {
            // Hosts without ui/download-file: a plain link download, if the frame allows it.
            Object.assign(document.createElement('a'), { href: dataUrl, download: name }).click();
          }
        } finally {
          button.disabled = false;
        }
      }
      $('download').addEventListener('click', downloadPng);

      // ── Tool result → picture.
      function showMessage(text) {
        image.hidden = true;
        $('controls').hidden = true;
        $('message').hidden = false;
        $('message').textContent = text;
      }

      function render(result) {
        const data = result.structuredContent || {};
        const svg = result._meta?.[META_KEY];
        $('title').textContent = String(data.label || 'ArchDraw diagram');
        const link = data.diagramUrl || data.shareUrl;
        $('open').hidden = !(typeof link === 'string' && /^https:\/\//.test(link));
        if (!$('open').hidden) $('open').href = link;
        if (data.success === false) return showMessage('ArchDraw could not draw this diagram.');
        if (typeof svg !== 'string' || !svg.startsWith('<svg')) {
          return showMessage(link ? 'Open the diagram in ArchDraw to view it.' : 'The preview is not available for this diagram.');
        }
        image.onload = () => {
          natural = { width: image.naturalWidth || 1200, height: image.naturalHeight || 600 };
          fitStageHeight();
          image.hidden = false;
          $('message').hidden = true;
          $('controls').hidden = false;
          fitView();
        };
        image.onerror = () => showMessage('The preview could not be drawn.');
        image.alt = `Architecture diagram: ${$('title').textContent}`;
        image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || !event.data || typeof event.data !== 'object') return;
        const message = event.data;
        if (message.id && pending.has(message.id)) {
          const waiter = pending.get(message.id);
          clearTimeout(waiter.timeout);
          pending.delete(message.id);
          if (message.error) waiter.reject(new Error(message.error.message || 'The chat rejected the request.'));
          else waiter.resolve(message.result || {});
          return;
        }
        if (message.method === 'ui/notifications/tool-result') render(message.params || {});
        if (message.method === 'ui/notifications/tool-cancelled') showMessage('Generation cancelled.');
        if (message.method === 'ui/notifications/host-context-changed' && message.params?.displayMode) setDisplayMode(message.params.displayMode);
      });

      new ResizeObserver(() => fitView()).observe(stage);

      request('ui/initialize', {
        appInfo: { name: 'ArchDraw diagram preview', version: '2.0.0' },
        appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
        protocolVersion: '2026-01-26',
      }).then((result) => {
        const context = result.hostContext || {};
        notify('ui/notifications/initialized', {});
        // Offer Expand only when the host says it can go fullscreen.
        $('fullscreen').hidden = !(context.availableDisplayModes || []).includes('fullscreen');
        if (context.displayMode) setDisplayMode(context.displayMode);
        reportSize();
        const sizeObserver = new ResizeObserver(reportSize);
        sizeObserver.observe(document.documentElement);
        sizeObserver.observe(document.body);
      }).catch(() => {});
    })();
  </script>
</body>
</html>
